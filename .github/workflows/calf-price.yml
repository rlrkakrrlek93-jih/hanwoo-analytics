name: Hanwoo calf price daily official check
on:
  push:
    branches: [main]
    paths:
      - 'calf_price_sync.py'
      - '.github/workflows/calf-price.yml'
  workflow_dispatch:
  schedule:
    # 10:07 AM Korean time, after normal survey day close.
    - cron: '7 1 * * *'
permissions:
  contents: write
concurrency:
  group: hanwoo-calf-price-check
  cancel-in-progress: false
jobs:
  official-calf-price:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source page reader
        run: |
          python -m pip install --quiet beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Collect price and validate survey date
        run: python calf_price_sync.py
      - name: Commit verified results only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calf_price_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified calf auction prices"
            git pull --rebase
            git push
          fi
