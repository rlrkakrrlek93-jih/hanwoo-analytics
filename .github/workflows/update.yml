name: Hanwoo Daily Update

on:
  push:
    branches: [main]
    paths:
      - 'semen_krei_sync.py'
      - 'hanwoo_update_health.py'
      - 'market_supply_sync.py'
      - 'beef_grade_sync.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
      timezone: Asia/Seoul

permissions:
  contents: write

concurrency:
  group: hanwoo-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymupdf requests beautifulsoup4 pillow pytesseract
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Safe collect, verify, and automatically recover
        id: quality
        continue-on-error: true
        run: python auto_quality.py

      - name: Commit verified quality data and agent report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.csv data.json quality_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Safe update Hanwoo statistics and quality report"
            git push
          fi

      - name: Collect grade incidence
        id: grades
        continue-on-error: true
        run: python grade_sync.py
      - name: Commit grade statistics
        run: |
          git add grade_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Hanwoo grade statistics"
            git push
          fi

      - name: Collect monthly slaughter age
        id: ages
        continue-on-error: true
        run: python age_sync.py
      - name: Commit slaughter age statistics
        run: |
          git add age_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update monthly slaughter age"
            git push
          fi


      - name: Refresh monthly Hanwoo supply indicators (safe)
        id: market
        continue-on-error: true
        run: python market_supply_sync.py
      - name: Commit independently verified supply data
        run: |
          git add market_supply_data.json market_supply_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update monthly Hanwoo inventory and all-sex grading"
            git push
          fi

      - name: Collect newly published verified Hanwoo semen sales
        id: semen_association
        continue-on-error: true
        run: python semen_sales_sync.py
      - name: Extract and validate new KREI image-PDF semen sales
        id: semen_krei
        continue-on-error: true
        run: python semen_krei_sync.py
      - name: Commit confirmed monthly semen sales only
        run: |
          git add semen_sales_data.json
          if [ -f semen_krei_status.json ]; then git add semen_krei_status.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update verified Hanwoo semen sales (Association / KREI)"
            git push
          fi

      - name: Probe new cattle statistics
        id: diagnostic
        continue-on-error: true
        run: python probe_new_stats.py
      - name: Save cattle statistics diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-stats-probe
          path: new_stats_probe/
          if-no-files-found: warn

      - name: Collect national beef steer statistics
        id: beef
        continue-on-error: true
        run: python beef_national_sync.py
      - name: Commit national beef steer data
        run: |
          git add beef_national_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update national beef steer"
            git push
          fi

      - name: Collect official beef steer grade 1+ distribution
        id: beef_grades
        continue-on-error: true
        run: python beef_grade_sync.py
      - name: Commit independently verified beef steer grade incidence
        run: |
          if [ -f beef_grade_data.json ]; then git add beef_grade_data.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update official beef steer 1+ grade incidence"
            git push
          fi

      - name: Save collector health and latest published months
        if: always()
        id: health
        env:
          COLLECT_QUALITY: ${{ steps.quality.outcome }}
          COLLECT_GRADES: ${{ steps.grades.outcome }}
          COLLECT_AGES: ${{ steps.ages.outcome }}
          COLLECT_MARKET: ${{ steps.market.outcome }}
          COLLECT_SEMEN_ASSOCIATION: ${{ steps.semen_association.outcome }}
          COLLECT_SEMEN_KREI: ${{ steps.semen_krei.outcome }}
          COLLECT_BEEF: ${{ steps.beef.outcome }}
          COLLECT_BEEF_GRADES: ${{ steps.beef_grades.outcome }}
        run: python hanwoo_update_health.py

      - name: Publish daily collector health status
        if: always()
        run: |
          for FILE in auto_update_status.json semen_krei_status.json; do
            if [ -f "$FILE" ]; then git add "$FILE"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record verified Hanwoo data refresh health by indicator"
            git push
          fi

      - name: Report collector failures after saving successful data
        if: always()
        env:
          COLLECT_QUALITY: ${{ steps.quality.outcome }}
          COLLECT_GRADES: ${{ steps.grades.outcome }}
          COLLECT_AGES: ${{ steps.ages.outcome }}
          COLLECT_MARKET: ${{ steps.market.outcome }}
          COLLECT_SEMEN_ASSOCIATION: ${{ steps.semen_association.outcome }}
          COLLECT_SEMEN_KREI: ${{ steps.semen_krei.outcome }}
          COLLECT_BEEF: ${{ steps.beef.outcome }}
          COLLECT_BEEF_GRADES: ${{ steps.beef_grades.outcome }}
          COLLECT_HEALTH: ${{ steps.health.outcome }}
        run: |
          FAILED=0
          for NAME in QUALITY GRADES AGES MARKET SEMEN_ASSOCIATION SEMEN_KREI BEEF BEEF_GRADES HEALTH; do
            VAR="COLLECT_$NAME"
            RESULT="${!VAR}"
            if [ "$RESULT" != "success" ]; then
              echo "::error::Hanwoo collector $NAME: $RESULT. Successful independent updates were saved."
              FAILED=1
            fi
          done
          exit "$FAILED"
