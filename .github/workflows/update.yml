
name: Hanwoo Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
      timezone: Asia/Seoul

permissions:
  contents: write

concurrency:
  group: hanwoo-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Collect official statistics
        run: python collect.py

      - name: Commit quality statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.csv data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Hanwoo quality statistics"
            git push
          fi

      - name: Collect grade incidence
        run: python grade_sync.py

      - name: Commit grade statistics
        run: |
          git add grade_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Hanwoo grade statistics"
            git push
          fi

      - name: Collect monthly slaughter age
        run: python age_sync.py

      - name: Commit slaughter age statistics
        run: |
          git add age_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update monthly slaughter age"
            git push
          fi

      - name: Probe new cattle statistics
        run: python probe_new_stats.py

      - name: Save cattle statistics diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-stats-probe
          path: new_stats_probe/
          if-no-files-found: warn
          
      - name: Collect national beef steer statistics
        run: python beef_national_sync.py

      - name: Commit national beef steer data
        run: |
          git add beef_national_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update national beef steer"
            git push
          fi


