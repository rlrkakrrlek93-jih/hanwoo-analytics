name: Verify beef steer grade 1+ from official table
on:
  push:
    branches: [main]
    paths:
      - 'beef_grade_sync.py'
      - 'grade_request_template.json'
      - '.github/workflows/beef-grade.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: beef-steer-grade-official
  cancel-in-progress: false
jobs:
  update-beef-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official table parser and browser
        run: |
          python -m pip install -q beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Collect and validate monthly beef steer grade counts
        run: python beef_grade_sync.py
      - name: Commit verified figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beef_grade_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified beef steer grade 1+ incidence"
            git pull --rebase
            git push
          fi
