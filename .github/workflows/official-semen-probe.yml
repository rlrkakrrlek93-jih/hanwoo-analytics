name: Probe official semen source structure
on:
  workflow_dispatch:
  pull_request:
    paths: ['semen_official_probe.py','.github/workflows/official-semen-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install read-only public document parsers
      run: pip install requests beautifulsoup4 pymupdf
    - name: Inspect official public semen page formats
      run: python semen_official_probe.py
    - name: Save diagnostic samples
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: official-semen-diagnostic
        path: semen_source_probe/
