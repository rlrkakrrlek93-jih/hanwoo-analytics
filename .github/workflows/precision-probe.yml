name: Inspect Official Precision (read-only)

on:
  pull_request:
    paths:
      - 'precision_probe.py'
      - 'test_precision_probe.py'
      - 'precision_compatibility.py'
      - 'test_precision_compatibility.py'
      - '.github/workflows/precision-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precision-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test parsing logic
        run: python -m unittest test_precision_probe test_precision_compatibility -v
      - name: Inspect public official tables without updating website
        run: python precision_probe.py --output-dir precision_probe_result
      - name: Check whether candidate source has comparable population
        run: python precision_compatibility.py --input-dir precision_probe_result
      - name: Store diagnostic evidence (not a published dataset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-source-probe
          path: precision_probe_result/
          if-no-files-found: warn
