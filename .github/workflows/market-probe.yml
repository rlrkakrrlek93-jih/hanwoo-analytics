name: Probe market sources (read only)
on:
  pull_request:
    paths:
      - 'market_source_probe.py'
      - 'market_supply_sync.py'
      - 'market-indicators.js'
      - 'test_market_supply.py'
      - 'test_market_history_price.py'
      - '.github/workflows/market-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: JavaScript syntax validation
        run: node --check market-indicators.js
      - name: Validate market supply parser
        run: python -m unittest test_market_supply test_market_history_price -v
      - name: Live supply collector dry-run (no published file changed)
        run: python market_supply_sync.py --dry-run
      - name: Inspect public sources
        run: python market_source_probe.py
      - name: Archive diagnostic responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-source-diagnostics
          path: market_probe_output/
          if-no-files-found: warn
