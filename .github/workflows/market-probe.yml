name: Probe market sources (read only)
on:
  pull_request:
    paths:
      - 'market_source_probe.py'
      - '.github/workflows/market-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Inspect public sources
        run: python market_source_probe.py
      - name: Archive diagnostic responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-source-diagnostics
          path: market_probe_output/
          if-no-files-found: warn
