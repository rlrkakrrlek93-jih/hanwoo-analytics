name: Probe public semen sales sources
on:
  pull_request:
    paths:
      - 'semen_source_probe.py'
      - 'semen_sales_sync.py'
      - 'semen_sales_chart.js'
      - 'semen_sales_data.json'
      - 'test_semen_sales_sync.py'
      - 'test_semen_sales_browser.py'
      - 'semen_krei_probe.py'
      - 'index.html'
      - 'dashboard_template.html'
      - 'market-indicators.js'
      - '.github/workflows/semen-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semen-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -r requirements.txt pymupdf requests
          python -m playwright install --with-deps chromium
      - name: Extract monthly semen sale values from Association report PDFs
        run: python semen_report_probe.py
      - name: Run KREI official monthly source diagnostic
        run: python semen_krei_probe.py
      - name: Save KREI source diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semen-krei-source-diagnostic
          path: krei_probe_output/
          if-no-files-found: warn
      - name: Validate published source and parsing
        run: python -m unittest test_semen_sales_sync -v
      - name: Validate chart JavaScript
        run: node --check semen_sales_chart.js && node --check market-indicators.js
      - name: Live monthly collector dry-run
        run: python semen_sales_sync.py --dry-run
      - name: Browser regression
        run: python test_semen_sales_browser.py
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semen-year-chart-preview
          path: test_artifacts/semen_sales_annual_compare.png
          if-no-files-found: warn
      - name: Capture source diagnostics
        run: python semen_source_probe.py
      - name: Upload source summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semen-source-diagnostics
          path: semen_probe_result/
          if-no-files-found: warn
