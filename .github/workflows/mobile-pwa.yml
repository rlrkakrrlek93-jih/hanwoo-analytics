name: HANWOO Mobile PWA verification
on:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'app.js'
      - 'app.css'
      - 'index.html'
      - 'dashboard_template.html'
      - 'market-indicators.js'
      - 'calf-chart.js'
      - 'calf-chart.css'
      - 'calf-prices.js'
      - 'calf-prices.css'
      - 'calf_price_data.json'
      - 'thankscow-brand.js'
      - 'thankscow-brand.css'
      - 'quality-check.js'
      - 'service-worker.js'
      - 'test_native_mobile_app.py'
      - 'test_market_chart_browser.py'
  pull_request:
    paths:
      - 'index.html'
      - 'dashboard_template.html'
      - 'mobile.css'
      - 'app.html'
      - 'app.css'
      - 'app.js'
      - 'calf-chart.js'
      - 'calf-chart.css'
      - 'calf-prices.js'
      - 'calf-prices.css'
      - 'calf_price_data.json'
      - 'mobile-app.js'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'pwa/**'
      - 'test_mobile_pwa_browser.py'
      - 'test_native_mobile_app.py'
      - '.github/workflows/mobile-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check mobile JavaScript syntax
        run: |
          node --check mobile-app.js
          node --check app.js
          node --check calf-chart.js
          node --check calf-prices.js
          node --check market-indicators.js
          node --check thankscow-brand.js
          node --check quality-check.js
          node --check service-worker.js
      - name: Test PWA installation assets and mobile/desktop browser
        run: python test_native_mobile_app.py
      - name: Test numeric market charts and desktop UI
        run: python test_market_chart_browser.py
      - name: Save mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanwoo-mobile-preview
          path: test_artifacts/
          if-no-files-found: warn
